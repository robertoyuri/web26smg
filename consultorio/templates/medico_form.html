{% extends "menu.html" %}
{% load static %}

{% block titulo %}Cadastrar Médico{% endblock %}
{% block body %}
<div class="container">
    <br>
    <form method="POST" enctype="multipart/form-data">
        {% csrf_token %}
        <div class="row g-3">
            <div class="col-7">
                <label for="nome">Nome</label>
                {{ form.nome }}
            </div>
            <div class="col-3">
                <label for="crm">CRM</label>
                {{ form.crm }}
            </div>
            <div class="col-2">
                <label for="uf_crm">UF</label>
                {{ form.uf_crm }}
            </div>
        </div>
        <br>
        <div class="row g-3">
            <div class="col">
                <label for="especialidade">Especialidade</label>
                {{ form.especialidade }}
            </div>
            <div class="col">
                <label for="telefone">Telefone</label>
                {{ form.telefone }}
            </div>
        </div>
        <br>
        <div class="row g-3">
            <div class="col">
                <label for="email">E-mail</label>
                {{ form.email }}
            </div>
        </div>
        <br>
        <div class="row g-3">
            <div class="col">
                <button type="submit" class="btn btn-primary">Salvar</button>
            </div>
        </div>

    </form>
</div>
{% endblock %}
