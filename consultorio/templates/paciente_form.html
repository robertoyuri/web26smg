{% extends "menu.html" %}
{% load static %}

{% block titulo %}Cadastrar Paciente{% endblock %}

{% block body %}

<div class="container">
    <br>
    <form method="POST" enctype="multipart/form-data" action="{% url 'app:paciente_form' %}">
        {% csrf_token %}
        <div class="input-group mb-3">
            <span class="input-group-text" id="basic-addonNome">Nome</span>
            <input type="text" class="form-control" name="nome" placeholder="Nome" aria-label="Nome" aria-describedby="basic-addonNome" value="{{ paciente.nome|default:'' }}">
        </div>
        <div class="row">
            <div class="col">
                <div class="input-group mb-3">
                    <span class="input-group-text" id="basic-addonCPF">CPF</span>
                    <input type="text" class="form-control" name="cpf" placeholder="CPF" aria-label="CPF" aria-describedby="basic-addonCPF"  value="{{ paciente.cpf|default:'' }}">
                </div>
            </div>
            <div class="col">
                <div class="input-group mb-3">
                    <span class="input-group-text" id="basic-addonConvenio">Convenio</span>
                    <input type="text" class="form-control" name="convenio" placeholder="Convenio" aria-label="Convenio" aria-describedby="basic-addonConvenio"  value="{{ paciente.convenio|default:'' }}">
                </div>
            </div>
            <div class="col">
                <div class="input-group mb-3">
                    <span class="input-group-text" id="basic-addonTelefone">Telefone</span>
                    <input type="text" class="form-control" name="telefone" placeholder="Telefone" aria-label="Telefone" aria-describedby="basic-addonTelefone"  value="{{ paciente.telefone|default:'' }}">
                </div>
            </div>
        </div>

        <div class="row">
            <div class="col">
                <div class="input-group mb-3">
                    <input type="text" class="form-control" name="email" placeholder="E-mail" aria-label="E-mail" aria-describedby="basic-addonEmail"  value="{{ paciente.email|default:'' }}">
                    <span class="input-group-text" id="basic-addonEmail">@example.com</span>
                </div>
            </div>
            <div class="col">
                <div class="input-group mb-3">
                    <input type="date" class="form-control" name="nascimento" placeholder="Nascimento" aria-label="Nascimento" aria-describedby="basic-addonNascimento"  value="{{ paciente.nascimento|default:'' }}">
                    <span class="input-group-text" id="basic-addonNascimento">DD/MM/AAAA</span>
                </div>
            </div>
        </div>

        <div class="input-group mb-3">
            <button type="submit" class="btn btn-primary">Salvar</button>
        </div>

    </form>
</div>

{% endblock %}
